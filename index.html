<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>타로 카드</title>
    <meta name="description" content="라이더 웨이트 타로 카드를 뽑아보세요" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <h1 class="header__title">타로 카드</h1>
        <p class="header__subtitle">오늘의 메시지를 받아보세요</p>
      </header>

      <section class="options" aria-label="옵션">
        <div class="option">
          <label class="option__label" for="count">카드 수</label>
          <input
            class="option__input"
            id="count"
            type="number"
            min="1"
            value="3"
          />
        </div>

        <div class="option">
          <span class="option__label">방향</span>
          <div class="segmented" role="radiogroup" aria-label="카드 방향">
            <label>
              <input type="radio" name="direction" value="upright" checked />
              <span>정방향만</span>
            </label>
            <label>
              <input type="radio" name="direction" value="both" />
              <span>양방향</span>
            </label>
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="spread-toggle" />
          <span class="checkbox__box" aria-hidden="true"></span>
          <span class="checkbox__label">스프레드 배치</span>
        </label>
      </section>

      <section
        class="spread-editor"
        id="spread-editor"
        hidden
        aria-label="스프레드 편집기"
      >
        <div class="spread-editor__head">
          <button class="spread-editor__toggle" id="toggle-spread" type="button">
            <span class="spread-editor__caret" aria-hidden="true">▾</span>
            스프레드 편집기
          </button>
          <button class="spread-editor__reset" id="reset-spread" type="button">
            초기화
          </button>
        </div>
        <div class="spread-editor__body">
          <div class="spread-editor__shortcuts">
            드래그 스냅 (<kbd>Alt</kbd>+드래그 자유) ·
            <kbd>←↑→↓</kbd> 한 칸 ·
            <kbd>Shift</kbd>+방향키 두 칸 ·
            <kbd>T</kbd> 방향 전환 ·
            <kbd>Ctrl</kbd>+<kbd>Z</kbd> 실행취소
          </div>
          <div class="spread-editor__mat" id="spread-mat"></div>
        </div>
      </section>

      <div class="actions">
        <button id="draw-btn" class="btn" type="button">카드 뽑기</button>
      </div>

      <section id="result" class="result" aria-live="polite"></section>

      <footer class="footer">
        이미지 출처 ·
        <a
          href="https://commons.wikimedia.org/wiki/Category:RWS_Tarot_deck"
          target="_blank"
          rel="noopener noreferrer"
          >Wikimedia Commons (Public Domain, 1909)</a
        >
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
