<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가짜 이베트 타로 머신</title>
    <meta name="description" content="라이더 웨이트 타로 카드를 뽑아보세요" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <h1 class="header__title">가짜 이베트 타로 머신</h1>
      </header>

      <section class="options" aria-label="옵션">
        <div class="option">
          <label class="option__label" for="count">카드 수</label>
          <input
            class="option__input"
            id="count"
            type="number"
            min="1"
            value="3"
          />
        </div>

        <div class="option">
          <span class="option__label">방향</span>
          <div class="segmented" role="radiogroup" aria-label="카드 방향">
            <label>
              <input type="radio" name="direction" value="upright" checked />
              <span>정방향만</span>
            </label>
            <label>
              <input type="radio" name="direction" value="both" />
              <span>양방향</span>
            </label>
          </div>
        </div>

        <div class="option">
          <span class="option__label">범위</span>
          <div class="segmented" role="radiogroup" aria-label="카드 범위">
            <label>
              <input type="radio" name="arcana" value="all" checked />
              <span>모두</span>
            </label>
            <label>
              <input type="radio" name="arcana" value="major" />
              <span>메이저</span>
            </label>
            <label>
              <input type="radio" name="arcana" value="minor" />
              <span>마이너</span>
            </label>
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="spread-toggle" />
          <span class="checkbox__box" aria-hidden="true"></span>
          <span class="checkbox__label">스프레드 배치</span>
        </label>
      </section>

      <section
        class="spread-editor"
        id="spread-editor"
        hidden
        aria-label="스프레드 편집기"
      >
        <div class="spread-editor__head">
          <button class="spread-editor__toggle" id="toggle-spread" type="button">
            <span class="spread-editor__caret" aria-hidden="true">▾</span>
            스프레드 편집기
          </button>
          <button class="spread-editor__reset" id="reset-spread" type="button">
            초기화
          </button>
        </div>
        <div class="spread-editor__body">
          <div class="spread-editor__toolbar" role="toolbar" aria-label="스프레드 편집 도구">
            <button class="qa-btn" id="qa-multi" type="button" title="여러 카드를 클릭/드래그로 선택">
              <span class="qa-btn__icon" aria-hidden="true">⊞</span>다중 선택
            </button>
            <button class="qa-btn" id="qa-all" type="button" title="전체 선택 (Ctrl+A)">전체</button>
            <button class="qa-btn" id="qa-clear" type="button" title="선택 해제">해제</button>
            <span class="qa-divider" aria-hidden="true"></span>
            <button class="qa-btn" id="qa-rotate" type="button" title="90° 회전 (R)">
              <span class="qa-btn__icon" aria-hidden="true">↻</span>회전
            </button>
            <button class="qa-btn" id="qa-flip" type="button" title="정/역 전환 (T)">정/역</button>
            <button class="qa-btn" id="qa-resize" type="button" title="크기 조정 모드 (Ctrl+T → 방향키)">
              <span class="qa-btn__icon" aria-hidden="true">⇲</span>크기 조정
            </button>
            <span class="qa-divider" aria-hidden="true"></span>
            <button class="qa-btn" id="qa-undo" type="button" title="실행 취소 (Ctrl+Z)">
              <span class="qa-btn__icon" aria-hidden="true">↶</span>취소
            </button>
            <button class="qa-btn" id="qa-redo" type="button" title="다시 실행 (Ctrl+Shift+Z)">
              <span class="qa-btn__icon" aria-hidden="true">↷</span>다시
            </button>
          </div>
          <div class="spread-editor__shortcuts">
            단축키 ·
            <kbd>드래그</kbd> 영역 선택 ·
            <kbd>Shift</kbd>/<kbd>Ctrl</kbd>+클릭 추가·토글 ·
            <kbd>R</kbd> 회전 ·
            <kbd>T</kbd> 정/역 ·
            <kbd>Ctrl</kbd>+<kbd>T</kbd> 크기 ·
            <kbd>Ctrl</kbd>+<kbd>Z</kbd> 취소
          </div>
          <div class="spread-editor__mat" id="spread-mat"></div>
        </div>
      </section>

      <div class="actions">
        <button id="draw-btn" class="btn" type="button">카드 뽑기</button>
      </div>

      <section id="result" class="result" aria-live="polite"></section>

      <footer class="footer">
        제작 @ST3P8Y84CK with CLAUDE<br />
        이미지 출처 ·
        <a
          href="https://commons.wikimedia.org/wiki/Category:RWS_Tarot_deck"
          target="_blank"
          rel="noopener noreferrer"
          >Wikimedia Commons (Public Domain, 1909)</a
        >
      </footer>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
